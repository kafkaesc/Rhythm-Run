version: 1
env:
  secrets:
    - GET_SONG_BPM_KEY
    - LAST_FM_KEY
    - SPOTIFY_CLIENT_ID
    - SPOTIFY_CLIENT_SECRET
frontend:
  phases:
    preBuild:
      commands:
        # Install pnpm into the runner
        - npm install -g pnpm
        # Install project dependencies
        - pnpm install
    build:
      commands:
        # Build the Next app
        - pnpm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
