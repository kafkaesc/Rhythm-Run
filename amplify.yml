version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Install pnpm into the runner
        - npm install -g pnpm
        # Install project dependencies
        - pnpm install
    build:
      commands:
        # Build the Next app
        - pnpm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
