# SonarQube Cloud project identity.
sonar.organization=kafkaesc
sonar.projectKey=kafkaesc_Rhythm-Run

# Analyze production source.
sonar.sources=.

# JS/TS coverage report produced by `pnpm test:ci`.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Excluded from analysis entirely: tests, mocks, type declarations,
# generated outputs, and non-source assets.
sonar.exclusions=**/*.test.ts,**/*.test.tsx,mocks/**,**/*.d.ts,coverage/**,.next/**,public/**,**/*.debug.*,**/*.ico,**/*.png,**/*.jpg,**/*.woff,**/*.woff2

# Analyzed for quality but excluded from coverage metrics
# (app/api mirrors codecov.yml; config/infra is never unit-tested).
sonar.coverage.exclusions=app/api/**,jest.setup.ts,*.config.ts,*.config.mjs
